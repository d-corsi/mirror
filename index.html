<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Mirror</title>
    <style>
      @font-face {
        font-family: "Quicksand";
        src: url("/assets/font/quicksand-regular.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        --p1: #eeff00;
        --p2: #00d5ff;
        --bg: #05060a;
        --ink: #e9ecf4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: Quicksand, system-ui, -apple-system, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      /* ---------------------------------------------------------- screens */
      .screen {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: max(20px, env(safe-area-inset-top)) 20px
          max(20px, env(safe-area-inset-bottom));
        background: rgba(5, 6, 10, 0.82);
        backdrop-filter: blur(6px);
        text-align: center;
        z-index: 10;
      }
      .screen.on {
        display: flex;
      }
      .screen.transparent {
        background: none;
        backdrop-filter: none;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 11vw, 96px);
        font-weight: 400;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        line-height: 1;
        background: linear-gradient(180deg, var(--p1) 0%, var(--p1) 50%, var(--p2) 50%, var(--p2) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h2 {
        margin: 0;
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 400;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        text-transform: uppercase;
      }

      p.sub {
        margin: 0;
        opacity: 0.6;
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      button {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid rgba(233, 236, 244, 0.28);
        border-radius: 999px;
        padding: 13px 34px;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        text-transform: uppercase;
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s, transform 0.1s;
      }
      button:hover {
        border-color: var(--p1);
        background: rgba(238, 255, 0, 0.08);
      }
      button:active {
        transform: scale(0.97);
      }
      button.primary {
        border-color: var(--p1);
        color: var(--p1);
      }
      button.primary:hover {
        background: rgba(238, 255, 0, 0.12);
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ------------------------------------------------------ level select */
      #levelGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
        gap: 10px;
        width: min(680px, 92vw);
        max-height: 58vh;
        overflow-y: auto;
        padding: 4px;
      }

      .level {
        aspect-ratio: 1;
        border: 1px solid rgba(233, 236, 244, 0.2);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        font-size: 19px;
        letter-spacing: 0;
        text-indent: 0;
        padding: 0;
      }
      .level .stars {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--p1);
        opacity: 0.9;
        height: 12px;
      }
      .level[disabled] {
        opacity: 0.26;
        cursor: not-allowed;
      }
      .level[disabled]:hover {
        border-color: rgba(233, 236, 244, 0.2);
        background: rgba(255, 255, 255, 0.03);
      }
      .level.current {
        border-color: var(--p2);
        color: var(--p2);
      }

      /* --------------------------------------------------------------- hud */
      #hud {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 18px;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        pointer-events: none;
        opacity: 0.85;
        z-index: 5;
      }
      #hud .stars {
        color: var(--p1);
      }

      #topLeft {
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        display: flex;
        gap: 8px;
        z-index: 6;
      }
      #topLeft button {
        padding: 8px 14px;
        font-size: 11px;
      }

      /* ---------------------------------------------------------- tutorial */
      #tutorial {
        gap: 34px;
      }
      .halves {
        display: flex;
        gap: 14px;
        width: min(520px, 90vw);
      }
      .half {
        flex: 1;
        border: 1px dashed rgba(233, 236, 244, 0.25);
        border-radius: 14px;
        padding: 22px 12px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .half.p2 {
        color: var(--p2);
        border-color: rgba(0, 213, 255, 0.4);
      }
      .half.p1 {
        color: var(--p1);
        border-color: rgba(238, 255, 0, 0.4);
      }

      /*
       * Portrait hint. The playfield is pinned to 16:9 for fairness, so in
       * portrait it letterboxes down to a small strip -- playable, but much
       * nicer rotated. Touch devices only; desktop windows can be any shape.
       */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(5, 6, 10, 0.94);
        z-index: 20;
        text-align: center;
        padding: 24px;
      }
      #rotate .icon {
        font-size: 46px;
        animation: tilt 1.8s ease-in-out infinite;
      }
      @keyframes tilt {
        0%, 45%, 100% { transform: rotate(0deg); }
        60%, 85% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }

      #debug {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 11px;
        font-family: ui-monospace, Menlo, monospace;
        white-space: pre;
        opacity: 0.5;
        pointer-events: none;
        z-index: 5;
      }

      .starline {
        font-size: 30px;
        letter-spacing: 8px;
        color: var(--p1);
      }
      .starline .off {
        opacity: 0.22;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>

    <div id="hud"></div>
    <div id="topLeft"></div>
    <div id="debug"></div>

    <!-- menu -->
    <div class="screen" id="menu">
      <h1>Mirror</h1>
      <p class="sub" id="menuStars"></p>
      <div class="row">
        <button class="primary" id="btnPlay">Play</button>
        <button id="btnLevels">Levels</button>
        <button id="btnMusic">Music: on</button>
      </div>
      <p class="sub">Two runners, one mirrored world</p>
    </div>

    <!-- level select -->
    <div class="screen" id="select">
      <h2>Select level</h2>
      <div id="levelGrid"></div>
      <div class="row">
        <button id="btnBackFromSelect">Back</button>
        <button id="btnReset">Reset progress</button>
      </div>
    </div>

    <!-- tutorial overlay (level 1 only) -->
    <div class="screen transparent" id="tutorial">
      <div class="halves">
        <div class="half p2">Tap this side<br />to jump the ceiling runner</div>
        <div class="half p1">Tap this side<br />to jump the floor runner</div>
      </div>
      <p class="sub">Tap anywhere to begin</p>
    </div>

    <!-- death -->
    <div class="screen" id="death">
      <h2>Dead</h2>
      <div class="row">
        <button class="primary" id="btnRetry">Try again</button>
        <button id="btnDeathMenu">Menu</button>
      </div>
    </div>

    <!-- win -->
    <div class="screen" id="win">
      <h2>Level complete</h2>
      <div class="starline" id="winStars"></div>
      <div class="row">
        <button class="primary" id="btnNext">Next level</button>
        <button id="btnReplay">Replay</button>
        <button id="btnWinMenu">Menu</button>
      </div>
    </div>

    <!-- end of game -->
    <div class="screen" id="endgame">
      <h1>Complete</h1>
      <p class="sub" id="endStars"></p>
      <div class="row">
        <button class="primary" id="btnEndMenu">Menu</button>
      </div>
    </div>

    <div id="rotate">
      <div class="icon">📱</div>
      <h2>Rotate</h2>
      <p class="sub">Mirror plays in landscape</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
